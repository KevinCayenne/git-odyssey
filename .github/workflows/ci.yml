name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: 型別、lint、測試、建置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: 用真的瀏覽器把關卡打一遍
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: 起 server 並等它活過來
        run: |
          npx next start -p 3000 &
          npx wait-on http://localhost:3000 --timeout 60000
      - run: npm run e2e
        env:
          BASE_URL: http://localhost:3000
